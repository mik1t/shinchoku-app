# Cloudflare Pages（画面）＋ Pages Functions（API）の設定
# database_id はデプロイ用の GitHub Actions が自動で埋めるので、手で書き換える必要はありません。
name = "shinchoku"
pages_build_output_dir = "public"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]

[[d1_databases]]
binding = "DB"
database_name = "shinchoku-db"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

[ai]
binding = "AI"
